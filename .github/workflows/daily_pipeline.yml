name: Daily Crypto Pricing Pipeline

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/679527820915/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@crypto-pricing-pipeline.iam.gserviceaccount.com

      - name: Run crypto pricing pipeline
        run: |
          python src/main.py